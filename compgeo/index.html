<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Convex Hulls</title>
    <style>
      #webglCanvas {
        width: 900px;
        height: 600px;
        display: block;
        outline: 2px solid black;
      }

      header {
        display: flex;
        gap: 20px;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <button id="clearBtn">Clear</button>
        <br />
        <button id="stepBtn">Step</button>
      </div>
      <div>
        Algorithm:
        <br />
        <input type="radio" id="graham" name="algorithm" value="graham" />
        <label for="graham">Graham's Scan</label><br />
        <input
          type="radio"
          id="jarvis"
          name="algorithm"
          value="jarvis"
          checked
        />
        <label for="jarvis">Jarvis's March</label><br />
        <input type="radio" id="divcon" name="algorithm" value="divcon" />
        <label for="divcon">Divide and Conquer</label><br />
        <input type="radio" id="brute" name="algorithm" value="brute" />
        <label for="brute">Brute Force</label><br />
      </div>
    </header>

    <main>
      <div>
        <canvas id="webglCanvas"></canvas>
      </div>
    </main>

    <script src="index.js"></script>
  </body>
</html>
